# Application-category fingerprint ruleset (cleaned, v3 — min two signal types)
# Generated by build_rules.py — edit the generator, not this file.
#
# False-positive policy: every app-tier rule (weight >= 80) carries at least two
# signal TYPES; single-type rules were strengthened with real signals or removed.
# Infra tiers (weight 65-75) are exempt: single Server-header stack tags only
# ever produce Low-confidence category classification.
#
# Matching conventions (uniform; no regex anywhere):
#   host_any   : substrings vs Host header / SNI (primary SaaS signal)
#   uri_substr : substrings vs request URI
#   header_any : "name" = header-name substring; "name:value" = value contains
#   cookie_any : substrings vs cookie names
#   ua_any     : substrings vs User-Agent
